# Configuration for Nemi terminal emulator.

[log_settings]
enabled = true
output = <print>
include_callee = false
use_color = true
enable_info = true
enable_warnings = true
enable_errors = true


[render_settings]
vsync = true
padding_x = 10.0
padding_y = 10.0
line_padding = 3.0
italic_tilt = 1.5
underline_height = 1
underline_offset = 1.3
soft_blink = true
soft_blink_pow = 4.0
blink_speed = 8.0
char_spacing = 1.0

[font_settings]
font_filepath = Topaz-8.ttf
font_center_char_to_cell = true


[misc_settings]
show_frametime = false
hide_mouse = true

[scripts]
scrollback = ./scripts/scrollback.pl
cmdline = ./scripts/commandline.pl
vmode = ./scripts/vmode.pl

